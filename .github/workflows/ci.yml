name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: jraczek/statsservicebook

jobs:
  functional-tests:
    name: Functional tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build test container
        run: docker build -f test/Containerfile -t stravame-test .

      - name: Start test container
        run: docker run -d --name stravame-tests -p 8080:8080 stravame-test

      - name: Wait for test server
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/strava/me/index.html >/dev/null; then
              echo "server ready"
              exit 0
            fi
            echo "waiting for server... ($i)"
            sleep 1
          done
          echo "=== container logs ==="
          docker logs stravame-tests || true
          exit 1

      - name: Run shell unit tests
        run: |
          docker exec stravame-tests sh /opt/shell-tests.sh --junit /tmp/shell-tests.xml
          docker cp stravame-tests:/tmp/shell-tests.xml shell-tests.xml

      - name: Run functional tests
        run: |
          TMP_DIR=$(mktemp -d)
          pushd "$TMP_DIR"
          npm init -y >/dev/null
          npm install puppeteer >/dev/null
          cp "$GITHUB_WORKSPACE/test/functional-tests.mjs" .
          TEST_RESULTS="$GITHUB_WORKSPACE/test-results.xml" node functional-tests.mjs
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Publish JUnit test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: all-tests
          path: 'shell-tests.xml,test-results.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shell-tests.xml
            test-results.xml

      - name: Stop test container
        if: always()
        run: |
          docker stop stravame-tests || true
          docker rm stravame-tests || true

  # Builds the production image and pushes to Docker Hub.
  # Runs only after tests pass, and only on version tags or manual dispatch.
  # Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
  docker-publish:
    name: Docker publish
    runs-on: ubuntu-latest
    needs: functional-tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: README.md
