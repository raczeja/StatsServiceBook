name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: jraczek/statsservicebook

jobs:
  functional-tests:
    name: Functional tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build production image
        run: docker build -t stravame-prod .

      - name: Build test container
        run: docker build -f test/Containerfile --build-arg BASE=stravame-prod -t stravame-test .

      - name: Start test container
        run: docker run -d --name stravame-tests -p 8080:8080 stravame-test

      - name: Wait for test server
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/strava/me/index.html >/dev/null; then
              echo "server ready"
              exit 0
            fi
            echo "waiting for server... ($i)"
            sleep 1
          done
          echo "=== container logs ==="
          docker logs stravame-tests || true
          exit 1

      - name: Run shell unit tests
        run: |
          docker exec stravame-tests sh /opt/shell-tests.sh --junit /tmp/shell-tests.xml
          docker cp stravame-tests:/tmp/shell-tests.xml shell-tests.xml

      - name: Run functional tests
        run: |
          TMP_DIR=$(mktemp -d)
          pushd "$TMP_DIR"
          npm init -y >/dev/null
          npm install playwright >/dev/null
          npx playwright install chromium --with-deps >/dev/null
          cp "$GITHUB_WORKSPACE/test/functional-tests.mjs" .
          TEST_RESULTS="$GITHUB_WORKSPACE/test-results.xml" \
          TEST_RESULTS_JSON="$GITHUB_WORKSPACE/test-results/results.json" \
          PLAYWRIGHT_REPORT_DIR="$GITHUB_WORKSPACE/playwright-report" \
          node functional-tests.mjs
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Count tests and update badge gist
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.BADGE_GIST_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys, xml.etree.ElementTree as ET
          if not os.environ.get("GIST_ID") or not os.environ.get("GIST_TOKEN"):
              print("BADGE_GIST_ID or GIST_TOKEN secret not set — skipping badge update")
              sys.exit(0)

          total, failures = 0, 0
          for f in ['shell-tests.xml', 'test-results.xml']:
              try:
                  root = ET.parse(f).getroot()
                  suites = root.findall('testsuite') if root.tag == 'testsuites' else [root]
                  for s in suites:
                      total    += int(s.get('tests',    0))
                      failures += int(s.get('failures', 0)) + int(s.get('errors', 0))
              except Exception:
                  pass

          badge = json.dumps({
              "schemaVersion": 1,
              "label":   "tests",
              "message": f"{total} passed" if failures == 0 else f"{total} total, {failures} failed",
              "color":   "brightgreen"     if failures == 0 else "red",
          })
          payload = json.dumps({"files": {"tests.json": {"content": badge}}})

          gist_id = os.environ["GIST_ID"]
          token   = os.environ["GIST_TOKEN"]
          subprocess.run([
              "curl", "-sf", "-X", "PATCH",
              f"https://api.github.com/gists/{gist_id}",
              "-H", f"Authorization: token {token}",
              "-H", "Content-Type: application/json",
              "-d", payload,
          ], check=True)
          print(f"Badge updated: {badge}")
          EOF

      - name: Publish JUnit test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: all-tests
          path: 'shell-tests.xml,test-results.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            shell-tests.xml
            test-results.xml
            test-results/results.json
            playwright-report/

      - name: Stop test container
        if: always()
        run: |
          docker stop stravame-tests || true
          docker rm stravame-tests || true

  # Builds the production image and pushes to Docker Hub.
  # Runs only after tests pass, and only on version tags or manual dispatch.
  # Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
  docker-publish:
    name: Docker publish
    runs-on: ubuntu-latest
    needs: functional-tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Requires DOCKERHUB_PASSWORD secret (actual account password, not a PAT).
      # The Hub web API uses a different auth endpoint than the registry push API.
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ env.IMAGE }}
          readme-filepath: README.md
